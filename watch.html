<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Rashka Barre — Watch</title>
<script src="https://assets.mediadelivery.net/playerjs/player-0.1.0.min.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.video-wrap{position:relative;width:100%;max-width:1200px;aspect-ratio:16/9;background:#000;overflow:hidden}
iframe{width:100%;height:100%;border:0;display:block}
.gate{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.96);padding:24px;box-sizing:border-box}
.gate-card{width:100%;max-width:560px}.gate-kicker{margin:0 0 12px;color:#ff5a67;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.gate h1{margin:0 0 12px;font-size:clamp(28px,5vw,52px);line-height:1}.gate p{margin:0 0 24px;color:#b7b7bf;line-height:1.6;font-size:15px}
.buy-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;background:#e63946;color:#fff;text-decoration:none;font-weight:800}
.buy-btn:hover{background:#ff5a67}
</style>
</head>
<body>
<div class="page"><div class="video-wrap" id="videoContainer"></div></div>

<script>
const PRODUCTS = {
  "taxanaha-kiyow-episode-1": {
    libraryId: "763894",
    videoId: "7e638a65-c874-4b96-b1c5-24a9201d8946",
    title: "TAXANAHA KIYOW — Qeybta 1",
    videoKey: "taxanaha-kiyow-episode-1"
  },

  "taxanaha-kiyow-episode-2": {
    libraryId: "770512",
    videoId: "77c810da-3dd8-4f1f-ba5d-e97089bb6e48",
    title: "TAXANAHA KIYOW — Qeybta 2",
    videoKey: "taxanaha-kiyow-episode-2"
  }
};

const ENGAGEMENT_URL="https://rashka-engagement.waddanisoamli.workers.dev";

const params=new URLSearchParams(location.search);
const token=params.get("token");
const expires=params.get("expires");
const productKey=params.get("product");

const product=PRODUCTS[productKey];
const container=document.getElementById("videoContainer");

let viewRecorded=false;

function showPurchaseGate(){
 const gate=document.createElement("div");
 gate.className="gate";

 const title=product
   ? product.title
   : "TAXANAHA KIYOW";

 const paymentUrl=product
   ? "https://rashka-payment.waddanisoamli.workers.dev/buy?product="+encodeURIComponent(product.videoKey)
   : "https://rashka-payment.waddanisoamli.workers.dev/buy";

 gate.innerHTML='<div class="gate-card"><p class="gate-kicker">FULL EPISODE</p><h1>'+title+'</h1><p>Qeybtan waxaa heli kara oo keliya dadka iibsada muuqaalka. Lacag bixintu waxay ku siinaysaa 2 saacadood oo daawasho ah.</p><a class="buy-btn" href="'+paymentUrl+'">BUY & WATCH — $0.26</a></div>';

 container.appendChild(gate);
}

async function recordView(){
 if(viewRecorded) return;
 viewRecorded=true;

 try{
  const response=await fetch(ENGAGEMENT_URL+"/view",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    video: product ? product.videoKey : productKey
   })
  });

  if(!response.ok){
   viewRecorded=false;
   console.error("View tracking failed:",response.status);
   return;
  }

  const data=await response.json();
  console.log("View recorded:",data);

 }catch(error){
  viewRecorded=false;
  console.error("View tracking error:",error);
 }
}

function setupPlayer(iframe){
 const player=new playerjs.Player(iframe);

 player.on("ready",function(){
  console.log("Bunny Player.js ready");
 });

 player.on("play",function(){
  console.log("Bunny Player.js play event");
  recordView();
 });

 player.on("playing",function(){
  console.log("Bunny Player.js playing event");
  recordView();
 });

 player.on("timeupdate",function(timingData){
  try{
   const data=typeof timingData==="string"
     ? JSON.parse(timingData)
     : timingData;

   if(data && Number(data.seconds)>0){
    console.log("Bunny playback time detected:",data.seconds);
    recordView();
   }

  }catch(error){
   console.error("Bunny timeupdate parse error:",error);
  }
 });
}

if(token && expires && product){

 const iframe=document.createElement("iframe");

 iframe.id="bunny-stream-embed";

 iframe.src=
   "https://player.mediadelivery.net/embed/"
   +product.libraryId
   +"/"
   +product.videoId;

 iframe.title=product.title;

 iframe.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";

 iframe.allowFullscreen=true;

 iframe.referrerPolicy="strict-origin-when-cross-origin";

 container.appendChild(iframe);

 if(window.playerjs){
  setupPlayer(iframe);
 }else{
  window.addEventListener("load",function(){
   setupPlayer(iframe);
  });
 }

}else{
 showPurchaseGate();
}
</script>
</body>
</html>

<!-- Bunny Player.js view tracking + dynamic episode playback: 2026-10-05 -->

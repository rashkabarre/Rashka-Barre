<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Rashka Barre — Watch</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.video-wrap{position:relative;width:100%;max-width:1200px;aspect-ratio:16/9;background:#000;overflow:hidden}
iframe{width:100%;height:100%;border:0;display:block}
.gate{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.96);padding:24px;box-sizing:border-box}
.gate-card{width:100%;max-width:560px}.gate-kicker{margin:0 0 12px;color:#ff5a67;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.gate h1{margin:0 0 12px;font-size:clamp(28px,5vw,52px);line-height:1}.gate p{margin:0 0 24px;color:#b7b7bf;line-height:1.6;font-size:15px}
.buy-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;background:#e63946;color:#fff;text-decoration:none;font-weight:800}
.buy-btn:hover{background:#ff5a67}
</style>
</head>
<body>
<div class="page"><div class="video-wrap" id="videoContainer"></div></div>
<script src="https://assets.mediadelivery.net/playerjs/player-0.1.0.min.js"></script>
<script>
const LIBRARY_ID="761815";
const TRAILER_ID="2861540b-30a0-4331-9e66-d267627aac29";
const EPISODE_1_ID="7e638a65-c874-4b96-b1c5-24a9201d8946";
const FREE_LIMIT_SECONDS=582;
const PAYMENT_BASE="https://rashka-payment.waddanisoamli.workers.dev/buy";
const PRODUCTS={
 "aarkii-kiyow":{title:"Aarkii Kiyow — Trailer",price:"$0.25",videoId:TRAILER_ID,preview:true},
 "taxanaha-kiyow-episode-1":{title:"TAXANAHA KIYOW — Qeybta 1",price:"$0.26",videoId:EPISODE_1_ID,preview:false}
};
const params=new URLSearchParams(location.search);
const productId=params.get("product")||"aarkii-kiyow";
const product=PRODUCTS[productId]||PRODUCTS["aarkii-kiyow"];
const token=params.get("token"),expires=params.get("expires");
const container=document.getElementById("videoContainer");
function paymentUrl(){return productId==="aarkii-kiyow"?PAYMENT_BASE:PAYMENT_BASE+"?product="+encodeURIComponent(productId)}
function showPurchaseGate(kicker,heading,message){
 const iframe=document.getElementById("videoFrame");
 if(iframe){iframe.style.visibility="hidden";iframe.style.pointerEvents="none"}
 if(document.getElementById("purchaseGate"))return;
 const gate=document.createElement("div");gate.id="purchaseGate";gate.className="gate";
 gate.innerHTML='<div class="gate-card"><p class="gate-kicker">'+kicker+'</p><h1>'+heading+'</h1><p>'+message+'</p><a class="buy-btn" href="'+paymentUrl()+'">BUY FULL VIDEO — '+product.price+'</a></div>';
 container.appendChild(gate);
}
function startPaidVideo(){
 const iframe=document.createElement("iframe");
 iframe.id="videoFrame";
 iframe.src="https://player.mediadelivery.net/embed/"+LIBRARY_ID+"/"+product.videoId+"?token="+encodeURIComponent(token)+"&expires="+encodeURIComponent(expires);
 iframe.title=product.title;
 iframe.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
 iframe.allowFullscreen=true;iframe.referrerPolicy="strict-origin-when-cross-origin";
 container.appendChild(iframe);
}
function startFreePreview(){
 const iframe=document.createElement("iframe");iframe.id="videoFrame";
 iframe.src="https://player.mediadelivery.net/embed/"+LIBRARY_ID+"/"+TRAILER_ID+"?playerjs=true";
 iframe.title="Aarkii Kiyow — Trailer";iframe.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
 iframe.allowFullscreen=true;iframe.referrerPolicy="strict-origin-when-cross-origin";container.appendChild(iframe);
 const player=new playerjs.Player(iframe);let locked=false;
 function lockPreview(){if(locked)return;locked=true;player.pause();player.setCurrentTime(FREE_LIMIT_SECONDS);showPurchaseGate("9:42 Free Preview Finished","BUY FULL VIDEO","Waxaad daawatay 9 daqiiqo iyo 42 ilbiriqsi oo bilaash ah. Si aad u sii waddo dokumentariga oo dhammaystiran, iibso muuqaalka.")}
 player.on("ready",function(){player.setLoop(false);const clock=setInterval(function(){if(locked){clearInterval(clock);return}player.getCurrentTime(function(seconds){const current=Number(seconds);if(Number.isFinite(current)&&current>=FREE_LIMIT_SECONDS)lockPreview()})},250)});
 player.on("timeupdate",function(data){if(!data)return;let seconds;if(typeof data==="object")seconds=Number(data.seconds);else{try{seconds=Number(JSON.parse(data).seconds)}catch(e){seconds=NaN}}if(Number.isFinite(seconds)&&seconds>=FREE_LIMIT_SECONDS)lockPreview()});
 player.on("seeked",function(data){if(locked)return;const seconds=Number(data&&data.seconds);if(Number.isFinite(seconds)&&seconds>=FREE_LIMIT_SECONDS)lockPreview()});
 player.on("ended",function(){if(!locked)lockPreview()});
}
if(token&&expires)startPaidVideo();
else if(product.preview)startFreePreview();
else showPurchaseGate("FULL EPISODE",product.title,"Qeybtan waxaa heli kara oo keliya dadka iibsada muuqaalka. Lacag bixintu waxay ku siinaysaa 2 saacadood oo daawasho ah.");
</script>
</body>
</html>

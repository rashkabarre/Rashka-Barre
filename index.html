  <style>

    /* =========================================================
       DESIGN SYSTEM
       ========================================================= */

    :root {

      --bg: #0a0a0a;
      --card: #121212;
      --card-hover: #171717;

      --border: #242424;

      --text: #ffffff;
      --muted: #a0a0a0;

      --accent: #e50914;
      --accent-hover: #f51b25;

      --max-width: 1080px;

      --radius: 12px;

      --gap: 18px;
    }


    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      background: var(--bg);
    }

    body {

      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .header {

      width: 100%;

      border-bottom:
        1px solid var(--border);

      background: #0a0a0a;
    }


    .header-inner {

      max-width: var(--max-width);

      min-height: 72px;

      margin: 0 auto;

      padding:
        0 20px;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    .brand {

      width: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 13px;
    }


    .brand-line {

      height: 1px;

      flex: 1;

      max-width: 230px;

      background:
        #2a2a2a;
    }


    /*
      LOGO PLACEHOLDER

      Replace this later with your actual logo.
    */

    .logo-placeholder {

      width: 42px;
      height: 42px;

      flex: 0 0 42px;

      display: grid;

      place-items: center;

      border:
        1px solid #363636;

      border-radius: 9px;

      background:
        #171717;

      color: #888;

      font-size: 11px;

      font-weight: 900;

      letter-spacing: 0.6px;
    }


    .brand-name {

      color: #fff;

      font-size: 20px;

      font-weight: 800;

      letter-spacing: -0.4px;

      white-space: nowrap;
    }


    /* =========================================================
       MAIN
       ========================================================= */

    .container {

      width: 100%;

      max-width: var(--max-width);

      margin: 0 auto;

      padding:
        34px 20px
        65px;
    }


    /* =========================================================
       WELCOME
       ========================================================= */

    .welcome {

      max-width: 760px;

      margin:
        0 auto
        32px;

      text-align: center;
    }


    .welcome-label {

      margin:
        0 0 7px;

      color: var(--accent);

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    .welcome-title {

      margin: 0;

      color: #fff;

      font-size:
        clamp(34px, 6vw, 48px);

      line-height: 1;

      font-weight: 800;

      letter-spacing: -1.5px;
    }


    .welcome-text {

      margin:
        10px auto 0;

      max-width: 680px;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.55;
    }


    /* =========================================================
       INTRODUCTION
       ========================================================= */

    .intro {

      margin:
        0 auto
        35px;

      padding:
        18px 0;

      border-top:
        1px solid var(--border);

      border-bottom:
        1px solid var(--border);
    }


    .intro-title {

      margin:
        0 0 8px;

      color: #fff;

      font-size: 18px;

      line-height: 1.2;

      font-weight: 800;
    }


    .intro p {

      margin: 5px 0;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.55;

      max-width: 900px;
    }


    /* =========================================================
       VIDEO SECTION HEADER
       ========================================================= */

    .videos-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 17px;
    }


    .videos-title {

      margin: 0;

      font-size: 26px;

      line-height: 1.1;

      font-weight: 800;

      letter-spacing: -0.8px;
    }


    .videos-order {

      color: var(--muted);

      font-size: 11px;

      white-space: nowrap;
    }


    /* =========================================================
       VIDEO GRID
       ========================================================= */

    #videoGrid {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: var(--gap);
    }


    /* =========================================================
       VIDEO CARD
       ========================================================= */

    .video-card {

      min-width: 0;

      overflow: hidden;

      background: var(--card);

      border:
        1px solid var(--border);

      border-radius: var(--radius);

      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    }


    .video-card:hover {

      transform:
        translateY(-2px);

      background:
        var(--card-hover);

      border-color:
        #373737;
    }


    /* =========================================================
       THUMBNAIL
       ========================================================= */

    .thumbnail-link {

      display: block;
    }


    .thumbnail {

      position: relative;

      width: 100%;

      aspect-ratio:
        16 / 9;

      overflow: hidden;

      background:
        #0f0f0f;
    }


    .thumbnail img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform 0.3s ease;
    }


    .thumbnail-link:hover
    .thumbnail img {

      transform:
        scale(1.025);
    }


    /* =========================================================
       LATEST BADGE
       ========================================================= */

    .latest-badge {

      position: absolute;

      top: 9px;
      left: 9px;

      z-index: 2;

      padding:
        5px 7px;

      border-radius: 5px;

      background:
        var(--accent);

      color: #fff;

      font-size: 8px;

      font-weight: 900;

      letter-spacing: 0.9px;

      text-transform: uppercase;
    }


    /* =========================================================
       VIDEO CONTENT
       ========================================================= */

    .video-content {

      padding:
        13px;
    }


    .video-title {

      margin: 0;

      color: #fff;

      font-size: 21px;

      line-height: 1.12;

      font-weight: 800;

      letter-spacing: -0.4px;

        Keeps cards visually aligned even when
        titles have different lengths.
      */

      min-height:
        47px;

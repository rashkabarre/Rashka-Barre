       ===================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const grid =
          document.getElementById(
            "videoGrid"
          );


        const emptyState =
          document.getElementById(
            "emptyState"
          );


        const searchInput =
          document.getElementById(
            "searchInput"
          );


        const galleryCount =
          document.getElementById(
            "galleryCount"
          );


        const year =
          document.getElementById(
            "year"
          );


        if (year) {

          year.textContent =
            new Date().getFullYear();

        }


        /*
         * Load products.js
         */

        const products =
          Array.isArray(
            window.PRODUCTS
          )
            ? [...window.PRODUCTS]
            : [];


        /*
         * Sort:
         *
         * 1. Published videos with dates:
         *    newest first.
         *
         * 2. Coming-soon videos:
         *    episode order.
         */

        products.sort(
          function (a, b) {

            const aComingSoon =
              a.status === "coming-soon";

            const bComingSoon =
              b.status === "coming-soon";


            if (
              !aComingSoon &&
              !bComingSoon
            ) {

              const dateA =
                new Date(
                  a.publishedAt || 0
                ).getTime();

              const dateB =
                new Date(
                  b.publishedAt || 0
                ).getTime();

              return dateB - dateA;
            }


            if (
              aComingSoon &&
              bComingSoon
            ) {

              const episodeA =
                extractEpisodeNumber(
                  a.subtitle
                );

              const episodeB =
                extractEpisodeNumber(
                  b.subtitle
                );

              return episodeA - episodeB;
            }


            /*
             * Published videos come first.
             */

            return aComingSoon ? 1 : -1;

          }
        );


        /*
         * Render
         */

        function renderVideos(
          searchTerm
        ) {

          const query =
            String(
              searchTerm || ""
            )
              .trim()
              .toLowerCase();


          const filtered =
            products.filter(
              function (product) {

                const title =
                  String(
                    product.title || ""
                  ).toLowerCase();


                const subtitle =
                  String(
                    product.subtitle || ""
                  ).toLowerCase();


                const description =
                  String(
                    product.description || ""
                  ).toLowerCase();


                return (
                  !query ||

                  title.includes(
                    query
                  ) ||

                  subtitle.includes(
                    query
                  ) ||

                  description.includes(
                    query
                  )
                );

              }
            );


          /*
           * Count
           */

          galleryCount.textContent =
            filtered.length === 1
              ? "1 video"
              : `${filtered.length} videos`;


          /*
           * No results
           */

          if (
            filtered.length === 0
          ) {

            grid.innerHTML =
              "";

            emptyState.hidden =
              false;

            return;
          }


          emptyState.hidden =
            true;


          /*
           * Build cards
           */

          grid.innerHTML =
            filtered
              .map(
                function (
                  product
                ) {

                  const title =
                    escapeHtml(
                      product.title ||
                      "Untitled"
                    );


                  const subtitle =
                    escapeHtml(
                      product.subtitle ||
                      ""
                    );


                  const description =
                    escapeHtml(
                      product.description ||
                      ""
                    );


                  const price =
                    escapeHtml(
                      product.price ||
                      ""
                    );


                  const thumbnail =
                    escapeHtml(
                      product.thumbnail ||
                      ""
                    );


                  const paymentUrl =
                    escapeHtml(
                      product.paymentUrl ||
                      "#"
                    );


                  const isComingSoon =
                    product.status ===
                    "coming-soon";


                  /*
                   * NEW only for a published
                   * video with the newest date.
                   */

                  const newestPublished =
                    products.find(
                      function (item) {

                        return (
                          item.status !==
                            "coming-soon" &&
                          item.publishedAt
                        );

                      }
                    );


                  const isNew =
                    !isComingSoon &&
                    newestPublished ===
                      product;


                  return `

                    <article
                      class="video-item"
                    >


                      <!-- TITLE -->

                      <h2
                        class="video-title"
                      >
                        ${title}
                      </h2>


                      <!-- SUBTITLE -->

                      <p
                        class="video-subtitle"
                      >
                        ${subtitle}
                      </p>


                      ${
                        isComingSoon

                          ? `

                            <!-- COMING SOON -->

                            <div
                              class="thumbnail"
                            >

                              <div
                                class="coming-soon-box"
                              >

                                <div
                                  class="coming-soon-content"
                                >

                                  <div
                                    class="coming-soon-icon"
                                  >
                                    ▶
                                  </div>

                                  <div
                                    class="coming-soon-text"
                                  >
                                    Coming Soon
                                  </div>

                                </div>

                              </div>

                            </div>


                            <div
                              class="status-badge"
                            >
                              Coming Soon
                            </div>

                          `

                          : `

                            <!-- AVAILABLE VIDEO -->

                            <a
                              href="${paymentUrl}"
                              class="thumbnail-link"
                              aria-label="${title}"
                            >

                              <div
                                class="thumbnail"
                              >

                                ${
                                  isNew
                                    ? `
                                      <span
                                        class="new-badge"
                                      >
                                        NEW
                                      </span>
                                    `
                                    : ""
                                }


                                <img
                                  src="${thumbnail}"
                                  alt="${title}"
                                  loading="lazy"
                                >

                              </div>

                            </a>


                            <!-- PRICE -->

                            <div
                              class="video-footer"
                            >

                              <span
                                class="price"
                              >
                                ${price}
                              </span>


                              <a
                                href="${paymentUrl}"
                                class="buy-button"
                              >
                                BUY & WATCH
                              </a>

                            </div>

                          `
                      }


                      ${
                        !isComingSoon
                          ? `
                            <!-- DESCRIPTION -->

                            <p
                              class="video-description"
                            >
                              ${description}
                            </p>
                          `
                          : ""
                      }

                    </article>

                  `;

                }
              )
              .join("");

        }


        /*
         * Search
         */

        searchInput.addEventListener(
          "input",

    /*
     * Extract the episode number
     * from:
     *
     * Qeybta 1 | Episode 1
     */

    function extractEpisodeNumber(
      value
    ) {

      const match =
        String(
          value || ""
        ).match(
          /Episode\s+(\d+)/i
        );


      return match
        ? Number(match[1])
        : 9999;

    }


    /*
     * Escape HTML
     */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

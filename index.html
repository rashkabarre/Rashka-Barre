<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rashka Barre — Videos</title>

  <meta
    name="description"
    content="Videos, documentaries and original stories by Rashka Barre."
  >

  <meta property="og:title" content="Rashka Barre — Videos">
  <meta
    property="og:description"
    content="Videos, documentaries and original stories by Rashka Barre."
  >
  <meta property="og:type" content="website">

  <style>
    :root {
      --bg: #080808;
      --surface: #111111;
      --border: #242424;
      --text: #ffffff;
      --muted: #9b9b9b;
      --red: #e50914;
      --red-hover: #ff1f2a;
      --max-width: 1050px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      width: 100%;
    }

    /* =================================
       HEADER
       ================================= */

    .header {
      border-bottom: 1px solid var(--border);
      background: #080808;
    }

    .header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 18px 20px;

      display: flex;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 21px;
      font-weight: 800;
    }

    /* =================================
       LOGO PLACEHOLDER
       Replace this later with your logo
       ================================= */

    .logo-placeholder {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #333;
      border-radius: 9px;

      background: #161616;

      color: #999;

      font-size: 11px;
      font-weight: 900;
    }

    /* =================================
       MAIN
       ================================= */

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 38px 20px 70px;
    }

    /* =================================
       VIDEOS SECTION HEADING
       ================================= */

    .section-heading {
      margin-bottom: 30px;
      padding-bottom: 20px;

      border-bottom: 1px solid var(--border);
    }

    .section-heading h1 {
      margin: 0;

      font-size: clamp(36px, 6vw, 52px);
      line-height: 1;

      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .section-heading p {
      margin: 10px 0 0;

      color: var(--muted);

      font-size: 15px;
      line-height: 1.5;
    }

    /* =================================
       VIDEO LIST
       ================================= */

    #videoGrid {
      display: flex;
      flex-direction: column;
    }

    .video-card {
      padding-bottom: 42px;
      margin-bottom: 42px;

      border-bottom: 1px solid var(--border);
    }

    .video-card:last-child {
      margin-bottom: 0;
    }

    /* =================================
       THUMBNAIL
       ================================= */

    .thumbnail-link {
      display: block;
    }

    .thumbnail {
      position: relative;

      width: 100%;
      aspect-ratio: 16 / 9;

      overflow: hidden;

      border-radius: 12px;

      background: #111;

      border: 1px solid #202020;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform 0.35s ease,
        filter 0.35s ease;
    }

    .thumbnail-link:hover img {
      transform: scale(1.025);
      filter: brightness(0.86);
    }

    /* =================================
       LATEST BADGE
       ================================= */

    .latest-badge {
      position: absolute;

      top: 14px;
      left: 14px;

      z-index: 5;

      padding: 7px 10px;

      border-radius: 6px;

      background: var(--red);

      color: white;

      font-size: 10px;
      font-weight: 900;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    /* =================================
       VIDEO INFORMATION
       ================================= */

    .video-info {
      padding-top: 18px;
    }

    .video-title {
      margin: 0;

      font-size: clamp(29px, 5vw, 44px);

      line-height: 1.06;

      font-weight: 800;

      letter-spacing: -1.2px;
    }

    .video-description {
      max-width: 760px;

      margin: 11px 0 0;

      color: var(--muted);

      font-size: 15px;

      line-height: 1.65;
    }

    /* =================================
       PRICE + BUTTON
       ================================= */

    .video-bottom {
      margin-top: 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .video-price {
      font-size: 18px;
      font-weight: 800;
    }

    .buy-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 135px;

      padding: 12px 19px;

      border-radius: 8px;

      background: var(--red);

      color: white;

      font-size: 14px;
      font-weight: 800;
    }

    .buy-button:hover {
      background: var(--red-hover);
    }

    /* =================================
       EMPTY
       ================================= */

    .empty-state {
      padding: 50px 20px;

      border: 1px dashed var(--border);
      border-radius: 10px;

      text-align: center;

      color: var(--muted);
    }

    .empty-state h2 {
      margin: 0 0 8px;
      color: white;
    }

    .empty-state p {
      margin: 0;
    }

    /* =================================
       FOOTER
       ================================= */

    .footer {
      border-top: 1px solid var(--border);

      padding: 25px 20px;

      color: var(--muted);

      font-size: 13px;

      text-align: center;
    }

    /* =================================
       MOBILE
       ================================= */

    @media (max-width: 650px) {

      .brand {
        font-size: 18px;
      }

      .logo-placeholder {
        width: 38px;
        height: 38px;
      }

      .container {
        padding-top: 30px;
      }

      .section-heading h1 {
        font-size: 38px;
      }

      .video-title {
        font-size: 30px;
      }

      .video-bottom {
        flex-direction: column;
        align-items: stretch;
      }

      .buy-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- =================================
       HEADER
       ================================= -->

  <header class="header">

    <div class="header-inner">

      <a
        href="index.html"
        class="brand"
        aria-label="Rashka Barre"
      >

        <!-- LOGO PLACEHOLDER -->
        <div class="logo-placeholder">
          RB
        </div>

        <span>
          Rashka Barre
        </span>

      </a>

    </div>

  </header>


  <!-- =================================
       MAIN CONTENT
       ================================= -->

  <main class="container">

    <!-- VIDEOS SECTION -->

    <section class="section-heading">

      <h1>
        Videos Section
      </h1>

      <p>
        Documentaries, episodes and original stories.
      </p>

    </section>


    <!-- VIDEO LIST -->

    <section
      id="videoGrid"
      aria-label="Rashka Barre videos"
    ></section>


    <div
      id="emptyState"
      class="empty-state"
      hidden
    >

      <h2>
        No videos yet
      </h2>

      <p>
        New videos will appear here.
      </p>

    </div>

  </main>


  <!-- =================================
       FOOTER
       ================================= -->

  <footer class="footer">

    © <span id="year"></span> Rashka Barre
  </footer>


  <!-- =================================
       PRODUCTS
       ================================= -->

  <script src="products.js?v=20260926"></script>


  <!-- =================================
       DISPLAY VIDEOS
       ================================= -->

  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const videoGrid =
        document.getElementById("videoGrid");

      const emptyState =
        document.getElementById("emptyState");

      const year =
        document.getElementById("year");


      if (year) {
        year.textContent =
          new Date().getFullYear();
      }


      const products =
        Array.isArray(window.PRODUCTS)
          ? [...window.PRODUCTS]
          : [];


      /*
       * NEWEST → OLDEST
       */

      products.sort((a, b) => {

        const dateA =
          new Date(
            a.publishedAt || 0
          ).getTime();

        const dateB =
          new Date(
            b.publishedAt || 0
          ).getTime();

        return dateB - dateA;

      });


      if (products.length === 0) {

        emptyState.hidden = false;

        return;
      }


      videoGrid.innerHTML =
        products.map((product, index) => {

          const title =
            escapeHtml(
              product.title || "Untitled"
            );

          const description =
            escapeHtml(
              product.description || ""
            );

          const price =
            escapeHtml(
              product.price || ""
            );

          const thumbnail =
            escapeHtml(
              product.thumbnail || ""
            );

          const paymentUrl =
            escapeHtml(
              product.paymentUrl || "#"
            );


          return `

            <article class="video-card">

              <a
                href="${paymentUrl}"
                class="thumbnail-link"
                aria-label="${title}"
              >

                <div class="thumbnail">

                  ${
                    index === 0
                      ? `
                        <span class="latest-badge">
                          Latest
                        </span>
                      `
                      : ""
                  }

                  <img
                    src="${thumbnail}"
                    alt="${title}"
                    loading="${
                      index === 0
                        ? "eager"
                        : "lazy"
                    }"
                  >

                </div>

              </a>


              <div class="video-info">

                <h2 class="video-title">
                  ${title}
                </h2>

                <p class="video-description">
                  ${description}
                </p>


                <div class="video-bottom">

                  <span class="video-price">
                    ${price}
                  </span>

                  <a
                    href="${paymentUrl}"
                    class="buy-button"
                  >
                    Buy & Watch
                  </a>

                </div>

              </div>

            </article>

          `;

        }).join("");

    });


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>

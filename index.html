<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#080808">

  <title>Rashka Barre — Videos</title>

  <meta
    name="description"
    content="Rashka Barre — documentaries, animal stories, experiences and original videos."
  >

  <style>

    :root {
      --bg: #080808;
      --surface: #111111;
      --border: #252525;
      --text: #ffffff;
      --muted: #999999;
      --accent: #e50914;
      --accent-hover: #ff1d28;
      --max-width: 1120px;
      --column-gap: 18px;
      --row-gap: 32px;
      --radius: 11px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    input {
      font: inherit;
    }

    /* =====================================================
       MAIN
       ===================================================== */

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 24px 20px 65px;
    }

    /* =====================================================
       BRAND BANNER
       ===================================================== */

    .banner {
      position: relative;
      overflow: hidden;
      min-height: 210px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: 15px;

      background:
        radial-gradient(
          circle at 12% 45%,
          rgba(229, 9, 20, 0.20),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #1b1b1b,
          #111111 55%,
          #090909
        );
    }

    .banner-inner {
      min-height: 210px;
      padding: 28px 32px;

      display: flex;
      align-items: center;
      gap: 24px;
    }

    .banner-logo {
      width: 100px;
      height: 100px;
      flex: 0 0 100px;
      object-fit: contain;
      padding: 7px;

      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;

      background: rgba(255, 255, 255, 0.04);
    }

    .banner-kicker {
      margin: 0 0 7px;
      color: #c9c9c9;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .banner-title {
      margin: 0;
      color: #ffffff;
      font-size: clamp(36px, 5vw, 56px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1.8px;
    }

    .banner-text {
      max-width: 650px;
      margin: 10px 0 0;
      color: #b4b4b4;
      font-size: 14px;
      line-height: 1.55;
    }

    /* =====================================================
       SEARCH
       ===================================================== */

    .search-wrap {
      margin-bottom: 26px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      color: #777;
      font-size: 18px;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 50px;

      padding: 0 17px 0 47px;

      border: 1px solid var(--border);
      border-radius: 9px;

      outline: none;

      background: var(--surface);
      color: #ffffff;

      font-size: 14px;
    }

    #searchInput::placeholder {
      color: #6d6d6d;
    }

    #searchInput:focus {
      border-color: #404040;
      background: #151515;
    }

    /* =====================================================
       GALLERY INFO
       ===================================================== */

    .gallery-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 16px;
    }

    .gallery-count {
      margin: 0;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
    }

    .gallery-order {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    /* =====================================================
       VIDEO GRID
       ===================================================== */

    #videoGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: var(--column-gap);
      row-gap: var(--row-gap);
    }

    /* =====================================================
       VIDEO ITEM
       ===================================================== */

    .video-item {
      min-width: 0;
    }

    /* =====================================================
       TITLE
       ===================================================== */

    .video-title {
      margin: 0;

      color: #ffffff;

      font-size: 24px;
      line-height: 1.1;

      font-weight: 900;

      letter-spacing: -0.55px;

      text-transform: uppercase;

      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;

      overflow: hidden;
    }

    /* =====================================================
       SUBTITLE
       ===================================================== */

    .video-subtitle {
      margin: 5px 0 11px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.4;

      font-weight: 400;

      text-transform: none;

      min-height: 18px;
    }

    /* =====================================================
       THUMBNAIL
       ===================================================== */

    .thumbnail {
      position: relative;

      width: 100%;
      aspect-ratio: 16 / 9;

      overflow: hidden;

      background: #101010;

      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;

      transition:
        transform 0.3s ease,
        filter 0.3s ease;
    }

    .thumbnail-link {
      display: block;
    }

    .thumbnail-link:hover .thumbnail img {
      transform: scale(1.025);
      filter: brightness(0.88);
    }

    /* =====================================================
       COMING SOON OVERLAY
       ===================================================== */

    .coming-soon-overlay {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 9px;

      text-align: center;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.20),
          rgba(0, 0, 0, 0.72)
        );
    }

    .coming-soon-episode {
      color: #ffffff;

      font-size: clamp(28px, 4vw, 44px);

      line-height: 1;

      font-weight: 900;

      letter-spacing: -1px;

      text-transform: uppercase;

      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .coming-soon-label {
      padding: 6px 9px;

      border-radius: 5px;

      background: rgba(0, 0, 0, 0.62);

      color: #ffffff;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    /* =====================================================
       TRAILER OVERLAY
       SAME STYLE AS COMING SOON LABEL
       ===================================================== */

    .trailer-overlay {
      position: absolute;
      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.20),
          rgba(0, 0, 0, 0.72)
        );
    }

    .trailer-watch-overlay {
      padding: 6px 9px;

      border-radius: 5px;

      background: rgba(0, 0, 0, 0.62);

      color: #ffffff;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    /* =====================================================
       NEW BADGE
       ===================================================== */

    .new-badge {
      position: absolute;

      top: 10px;
      right: 10px;

      z-index: 5;

      padding: 6px 8px;

      border-radius: 5px;

      background: var(--accent);

      color: #ffffff;

      font-size: 9px;

      font-weight: 900;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    /* =====================================================
       PRICE + BUTTON
       ===================================================== */

    .video-footer {
      margin-top: 10px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;
    }

    .price {
      color: #ffffff;

      font-size: 15px;

      font-weight: 800;

      white-space: nowrap;
    }

    .buy-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 36px;

      padding: 8px 14px;

      border-radius: 7px;

      background: var(--accent);

      color: #ffffff;

      font-size: 11px;

      font-weight: 800;

      white-space: nowrap;
    }

    .buy-button:hover {
      background: var(--accent-hover);
    }

    /* =====================================================
       DESCRIPTION
       ===================================================== */

    .video-description {
      margin: 10px 0 0;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.6;

      display: -webkit-box;

      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;

      overflow: hidden;
    }

    /* =====================================================
       NO RESULTS
       ===================================================== */

    .no-results {
      grid-column: 1 / -1;

      padding: 50px 20px;

      border: 1px dashed var(--border);

      border-radius: 10px;

      text-align: center;

      color: var(--muted);
    }

    .no-results h3 {
      margin: 0 0 7px;

      color: #ffffff;

      font-size: 18px;
    }

    .no-results p {
      margin: 0;

      font-size: 13px;
    }

    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {
      border-top: 1px solid var(--border);

      padding: 22px 20px;

      color: var(--muted);

      font-size: 11px;

      text-align: center;
    }

    /* =====================================================
       MOBILE / WEBVIEW
       ===================================================== */

    @media (max-width: 700px) {

      .container {
        padding: 14px 12px 45px;
      }

      .banner {
        min-height: 165px;
        border-radius: 11px;
      }

      .banner-inner {
        min-height: 165px;
        padding: 18px;
        gap: 14px;
      }

      .banner-logo {
        width: 70px;
        height: 70px;
        flex-basis: 70px;
        padding: 5px;
        border-radius: 11px;
      }

      .banner-kicker {
        font-size: 8px;
        letter-spacing: 1.4px;
      }

      .banner-title {
        font-size: 29px;
        letter-spacing: -1px;
      }

      .banner-text {
        margin-top: 7px;
        font-size: 10px;
        line-height: 1.4;
      }

      #searchInput {
        height: 46px;
        padding-left: 43px;
        font-size: 12px;
      }

      .search-wrap {
        margin-bottom: 20px;
      }

      .gallery-count {
        font-size: 11px;
      }

      .gallery-order {
        font-size: 9px;
      }

      #videoGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 9px;
        row-gap: 24px;
      }

      .video-title {
        font-size: 15px;
        line-height: 1.12;
      }

      .video-subtitle {
        margin: 4px 0 8px;
        font-size: 10px;
      }

      .thumbnail {
        border-radius: 8px;
      }

      .coming-soon-episode {
        font-size: 21px;
      }

      .coming-soon-label {
        padding: 5px 7px;
        font-size: 8px;
        letter-spacing: 1.2px;
      }

      .trailer-watch-overlay {
        padding: 5px 7px;
        font-size: 8px;
        letter-spacing: 1.2px;
      }

      .new-badge {
        top: 6px;
        right: 6px;
        padding: 4px 6px;
        font-size: 7px;
      }

      .video-footer {
        margin-top: 8px;
        gap: 6px;
      }

      .price {
        font-size: 11px;
      }

      .buy-button {
        min-height: 30px;
        padding: 6px 8px;
        font-size: 8px;
        border-radius: 5px;
      }

      .video-description {
        margin-top: 8px;
        font-size: 10px;
        line-height: 1.45;
      }
    }

    @media (max-width: 380px) {

      .container {
        padding-left: 8px;
        padding-right: 8px;
      }

      #videoGrid {
        column-gap: 7px;
        row-gap: 20px;
      }

      .video-title {
        font-size: 14px;
      }

      .video-subtitle {
        font-size: 9px;
      }

      .coming-soon-episode {
        font-size: 17px;
      }

      .coming-soon-label {
        font-size: 7px;
      }

      .trailer-watch-overlay {
        font-size: 7px;
      }

      .video-description {
        font-size: 9px;
      }

      .price {
        font-size: 10px;
      }

      .buy-button {
        padding: 6px 7px;
        font-size: 8px;
      }
    }

  </style>
</head>


<body>

  <main class="container">


    <!-- BRAND BANNER -->

    <section class="banner">

      <div class="banner-inner">

        <img
          src="logo.png"
          alt="Rashka Barre"
          class="banner-logo"
        >

        <div class="banner-copy">

          <p class="banner-kicker">
            Official Video Collection
          </p>

          <h1 class="banner-title">
            Rashka Barre
          </h1>

          <p class="banner-text">
            Documentaries, animal stories, experiences and
            original videos — all in one place.
          </p>

        </div>

      </div>

    </section>


    <!-- SEARCH -->

    <section class="search-wrap">

      <div class="search-box">

        <span
          class="search-icon"
          aria-hidden="true"
        >
          ⌕
        </span>

        <input
          id="searchInput"
          type="search"
          placeholder="Search videos..."
          autocomplete="off"
          spellcheck="false"
          aria-label="Search videos"
        >

      </div>

    </section>


    <!-- GALLERY INFO -->

    <div class="gallery-info">

      <p
        id="galleryCount"
        class="gallery-count"
      >
        0 videos
      </p>

      <span class="gallery-order">
        Newest → Oldest
      </span>

    </div>


    <!-- VIDEO GALLERY -->

    <section
      id="videoGrid"
      aria-label="Rashka Barre video gallery"
    ></section>


    <!-- NO RESULTS -->

    <div
      id="emptyState"
      class="no-results"
      hidden
    >

      <h3>
        No videos found
      </h3>

      <p>
        Try another search.
      </p>

    </div>

  </main>


  <!-- FOOTER -->

  <footer class="footer">
    © <span id="year"></span> Rashka Barre
  </footer>


  <!-- PRODUCTS -->

  <script src="products.js?v=20260926-1824"></script>


  <!-- GALLERY SCRIPT -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const grid =
          document.getElementById(
            "videoGrid"
          );

        const emptyState =
          document.getElementById(
            "emptyState"
          );

        const searchInput =
          document.getElementById(
            "searchInput"
          );

        const galleryCount =
          document.getElementById(
            "galleryCount"
          );

        const year =
          document.getElementById(
            "year"
          );


        if (year) {
          year.textContent =
            new Date().getFullYear();
        }


        const products =
          Array.isArray(
            window.PRODUCTS
          )
            ? [...window.PRODUCTS]
            : [];


        /*
         * AVAILABLE VIDEOS:
         * newest → oldest
         *
         * COMING SOON:
         * Episode 1 → 2 → 3 → 4
         */

        products.sort(
          function (a, b) {

            const aSoon =
              a.status === "coming-soon";

            const bSoon =
              b.status === "coming-soon";


            if (
              !aSoon &&
              !bSoon
            ) {

              return (
                new Date(
                  b.publishedAt || 0
                ).getTime() -
                new Date(
                  a.publishedAt || 0
                ).getTime()
              );

            }


            if (
              aSoon &&
              bSoon
            ) {

              return (
                extractEpisodeNumber(
                  a.subtitle
                ) -
                extractEpisodeNumber(
                  b.subtitle
                )
              );

            }


            return aSoon ? 1 : -1;

          }
        );


        /*
         * Find newest available video.
         */

        const newestAvailable =
          products.find(
            function (product) {

              return (
                product.status !==
                  "coming-soon" &&
                product.publishedAt
              );

            }
          );


        /*
         * RENDER
         */

        function renderVideos(
          searchTerm
        ) {

          const query =
            String(
              searchTerm || ""
            )
              .trim()
              .toLowerCase();


          const filtered =
            products.filter(
              function (product) {

                const title =
                  String(
                    product.title || ""
                  ).toLowerCase();

                const subtitle =
                  String(
                    product.subtitle || ""
                  ).toLowerCase();

                const description =
                  String(
                    product.description || ""
                  ).toLowerCase();


                return (
                  !query ||
                  title.includes(query) ||
                  subtitle.includes(query) ||
                  description.includes(query)
                );

              }
            );


          galleryCount.textContent =
            filtered.length === 1
              ? "1 video"
              : `${filtered.length} videos`;


          if (
            filtered.length === 0
          ) {

            grid.innerHTML =
              "";

            emptyState.hidden =
              false;

            return;

          }


          emptyState.hidden =
            true;


          grid.innerHTML =
            filtered
              .map(
                function (
                  product
                ) {

                  const title =
                    escapeHtml(
                      product.title ||
                      "Untitled"
                    );


                  const subtitle =
                    escapeHtml(
                      product.subtitle ||
                      ""
                    );


                  const description =
                    escapeHtml(
                      product.description ||
                      ""
                    );


                  const price =
                    escapeHtml(
                      product.price ||
                      ""
                    );


                  const thumbnail =
                    escapeHtml(
                      product.thumbnail ||
                      ""
                    );


                  const paymentUrl =
                    escapeHtml(
                      product.paymentUrl ||
                      "#"
                    );


                  const isComingSoon =
                    product.status ===
                    "coming-soon";


                  const isTrailer =
                    product.id ===
                    "aarkii-kiyow";


                  const isNew =
                    !isComingSoon &&
                    newestAvailable ===
                    product;


                  /*
                   * EPISODE NUMBER
                   */

                  const episodeNumber =
                    extractEpisodeNumber(
                      product.subtitle
                    );


                  /*
                   * COMING SOON CARD
                   */

                  if (
                    isComingSoon
                  ) {

                    return `

                      <article
                        class="video-item"
                      >

                        <h2
                          class="video-title"
                        >
                          ${title}
                        </h2>


                        <p
                          class="video-subtitle"
                        >
                          ${subtitle}
                        </p>


                        <div
                          class="thumbnail"
                        >

                          <img
                            src="${thumbnail}"
                            alt="${title}"
                            loading="lazy"
                          >


                          <div
                            class="coming-soon-overlay"
                          >

                            <div
                              class="coming-soon-episode"
                            >
                              EPISODE
                              ${episodeNumber}
                            </div>


                            <div
                              class="coming-soon-label"
                            >
                              COMING SOON
                            </div>

                          </div>

                        </div>


                        <p
                          class="video-description"
                        >
                          ${description}
                        </p>


                      </article>

                    `;

                  }


                  /*
                   * AVAILABLE VIDEO
                   */

                  return `

                    <article
                      class="video-item"
                    >

                      <h2
                        class="video-title"
                      >
                        ${title}
                      </h2>


                      <p
                        class="video-subtitle"
                      >
                        ${subtitle}
                      </p>


                      <a
                        href="${paymentUrl}"
                        class="thumbnail-link"
                        aria-label="${title}"
                      >

                        <div
                          class="thumbnail"
                        >

                          ${
                            isNew
                              ? `
                                <span
                                  class="new-badge"
                                >
                                  NEW
                                </span>
                              `
                              : ""
                          }


                          <img
                            src="${thumbnail}"
                            alt="${title}"
                            loading="lazy"
                          >


                          ${
                            isTrailer
                              ? `
                                <div
                                  class="trailer-overlay"
                                >

                                  <div
                                    class="trailer-watch-overlay"
                                  >
                                    DAAWO HADDDA
                                  </div>

                                </div>
                              `
                              : ""
                          }

                        </div>

                      </a>


                      <div
                        class="video-footer"
                      >

                        <span
                          class="price"
                        >
                          ${price}
                        </span>


                        ${
                          !isTrailer
                            ? `
                              <a
                                href="${paymentUrl}"
                                class="buy-button"
                              >
                                BUY & WATCH
                              </a>
                            `
                            : ""
                        }

                      </div>


                      <p
                        class="video-description"
                      >
                        ${description}
                      </p>


                    </article>

                  `;

                }
              )
              .join("");

        }


        /*
         * SEARCH
         */

        searchInput.addEventListener(
          "input",
          function () {

            renderVideos(
              searchInput.value
            );

          }
        );


        /*
         * INITIAL LOAD
         */

        renderVideos("");

      }
    );


    /*
     * Read:
     *
     * Qeybta 1 | Episode 1
     */

    function extractEpisodeNumber(
      value
    ) {

      const match =
        String(
          value || ""
        ).match(
          /Episode\s+(\d+)/i
        );


      return match
        ? Number(match[1])
        : 9999;

    }


    /*
     * Security
     */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>
</html>

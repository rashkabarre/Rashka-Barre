  <script src="products.js?v=20260926"></script>



  <!-- =====================================================
       GALLERY LOGIC
       ===================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const grid =
          document.getElementById(
            "videoGrid"
          );

        const emptyState =
          document.getElementById(
            "emptyState"
          );

        const searchInput =
          document.getElementById(
            "searchInput"
          );

        const year =
          document.getElementById(
            "year"
          );


        if (year) {

          year.textContent =
            new Date().getFullYear();

        }


        /*
         * Load products
         */

        const products =
          Array.isArray(
            window.PRODUCTS
          )
            ? [...window.PRODUCTS]
            : [];


        /*
         * NEWEST → OLDEST
         */

        products.sort(
          function (a, b) {

            const dateA =
              new Date(
                a.publishedAt || 0
              ).getTime();

            const dateB =
              new Date(
                b.publishedAt || 0
              ).getTime();

            return dateB - dateA;

          }
        );


        /*
         * Render gallery
         */

        function renderVideos(
          searchTerm
        ) {

          const query =
            String(
              searchTerm || ""
            )
              .trim()
              .toLowerCase();


          const filtered =
            products.filter(
              function (product) {

                const title =
                  String(
                    product.title || ""
                  ).toLowerCase();

                const description =
                  String(
                    product.description || ""
                  ).toLowerCase();

                return (
                  !query ||
                  title.includes(query) ||
                  description.includes(query)
                );

              }
            );


          if (
            filtered.length === 0
          ) {

            grid.innerHTML =
              "";

            emptyState.hidden =
              false;

            return;

          }


          emptyState.hidden =
            true;


          /*
           * Build each video
           */

          grid.innerHTML =
            filtered
              .map(
                function (
                  product
                ) {

                  const title =
                    escapeHtml(
                      product.title ||
                      "Untitled"
                    );


                  const description =
                    escapeHtml(
                      product.description ||
                      ""
                    );


                  const price =
                    escapeHtml(
                      product.price ||
                      ""
                    );


                  const thumbnail =
                    escapeHtml(
                      product.thumbnail ||
                      ""
                    );


                  const paymentUrl =
                    escapeHtml(
                      product.paymentUrl ||
                      "#"
                    );


                  /*
                   * Products are already sorted.
                   * First one is the newest.
                   */

                  const originalIndex =
                    products.indexOf(
                      product
                    );


                  const isNew =
                    originalIndex === 0;


                  return `

                    <article
                      class="video-item"
                    >

                      <!-- VIDEO TITLE -->

                      <h2
                        class="video-title"
                      >
                        ${title}
                      </h2>


                      <!-- SMALL SUBTITLE -->

                      <p
                        class="video-subtitle"
                      >
                        ${description}
                      </p>


                      <!-- RECTANGULAR VIDEO -->

                      <a
                        href="${paymentUrl}"
                        class="thumbnail-link"
                        aria-label="${title}"
                      >

                        <div
                          class="thumbnail"
                        >

                          ${
                            isNew
                              ? `
                                <span
                                  class="new-badge"
                                >
                                  NEW
                                </span>
                              `
                              : ""
                          }


                          <img
                            src="${thumbnail}"
                            alt="${title}"
                            loading="lazy"
                          >

                        </div>

                      </a>


                      <!-- PRICE + BUY -->

                      <div
                        class="video-footer"
                      >

                        <span
                          class="price"
                        >
                          ${price}
                        </span>


                        <a
                          href="${paymentUrl}"
                          class="buy-button"
                        >
                          BUY & WATCH
                        </a>

                      </div>

                    </article>

                  `;

                }
              )
              .join("");

        }


        /*
         * Search
         */

        searchInput.addEventListener(
          "input",
          function () {

            renderVideos(
              searchInput.value
            );

          }
        );


        /*
         * First load
         */

        renderVideos("");

      }
    );


    /*
     * Escape HTML
     */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#080808">

  <title>Rashka Barre — Videos</title>

  <meta
    name="description"
    content="Rashka Barre — documentaries, animal stories, experiences and original videos."
  >

  <style>

    /* =====================================================
       DESIGN
       ===================================================== */

    :root {
      --bg: #080808;
      --surface: #111111;
      --surface-hover: #171717;

      --border: #252525;

      --text: #ffffff;
      --muted: #9b9b9b;

      --accent: #e50914;
      --accent-hover: #ff1d28;

      --max-width: 1120px;
      --gap: 18px;

      --radius: 12px;
    }


    /* =====================================================
       RESET
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    input {
      font: inherit;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      width: 100%;

      background: #080808;

      border-bottom:
        1px solid var(--border);
    }


    .header-inner {
      width: 100%;
      max-width: var(--max-width);

      min-height: 70px;

      margin: 0 auto;

      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .brand {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 13px;
    }


    .brand-line {
      height: 1px;

      flex: 1;

      max-width: 220px;

      background:
        var(--border);
    }


    .header-logo {
      width: 48px;
      height: 48px;

      flex: 0 0 48px;

      object-fit: contain;
    }


    .brand-name {
      color: #fff;

      font-size: 21px;

      font-weight: 800;

      letter-spacing: -0.4px;

      white-space: nowrap;
    }


    /* =====================================================
       MAIN
       ===================================================== */

    .container {
      width: 100%;

      max-width: var(--max-width);

      margin: 0 auto;

      padding:
        25px 20px
        65px;
    }


    /* =====================================================
       BANNER
       ===================================================== */

    .banner {
      position: relative;

      overflow: hidden;

      min-height: 215px;

      margin-bottom: 20px;

      border:
        1px solid var(--border);

      border-radius: 15px;

      background:
        radial-gradient(
          circle at 15% 40%,
          rgba(229, 9, 20, 0.20),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #1a1a1a,
          #101010 55%,
          #090909
        );
    }


    .banner-inner {
      position: relative;

      z-index: 2;

      min-height: 215px;

      padding:
        28px 32px;

      display: flex;
      align-items: center;

      gap: 25px;
    }


    .banner-logo {
      width: 105px;
      height: 105px;

      flex: 0 0 105px;

      object-fit: contain;

      padding: 8px;

      border-radius: 17px;

      background:
        rgba(255, 255, 255, 0.04);

      border:
        1px solid rgba(255, 255, 255, 0.08);
    }


    .banner-kicker {
      margin: 0 0 7px;

      color: #cfcfcf;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    .banner-title {
      margin: 0;

      color: #fff;

      font-size:
        clamp(36px, 5vw, 58px);

      line-height: 0.98;

      font-weight: 900;

      letter-spacing: -2px;
    }


    .banner-text {
      max-width: 650px;

      margin: 11px 0 0;

      color: #b7b7b7;

      font-size: 14px;

      line-height: 1.55;
    }


    /* =====================================================
       SEARCH
       ===================================================== */

    .search-wrap {
      margin-bottom: 27px;
    }


    .search-box {
      position: relative;

      width: 100%;
    }


    .search-icon {
      position: absolute;

      top: 50%;
      left: 16px;

      transform:
        translateY(-50%);

      color: #777;

      font-size: 18px;

      pointer-events: none;
    }


    #searchInput {
      width: 100%;

      height: 52px;

      padding:
        0 18px 0 48px;

      border:
        1px solid var(--border);

      border-radius:
        9px;

      outline:
        none;

      background:
        var(--surface);

      color:
        #fff;

      font-size:
        14px;
    }


    #searchInput::placeholder {
      color: #6e6e6e;
    }


    #searchInput:focus {
      border-color:
        #3c3c3c;

      background:
        #151515;
    }


    /* =====================================================
       VIDEOS HEADING
       ===================================================== */

    .section-head {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 16px;
    }


    .section-title {
      margin: 0;

      color: #fff;

      font-size: 27px;

      line-height: 1.1;

      font-weight: 800;

      letter-spacing: -0.8px;
    }


    .section-count {
      color: var(--muted);

      font-size: 11px;

      white-space: nowrap;
    }


    /* =====================================================
       VIDEO GALLERY
       ===================================================== */

    #videoGrid {
      display: grid;

      /*
        Two columns.
        Rectangular 16:9 video thumbnails.
      */

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: var(--gap);
    }


    /* =====================================================
       VIDEO CARD
       ===================================================== */

    .video-card {
      min-width: 0;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    }


    .video-card:hover {
      transform:
        translateY(-2px);

      border-color:
        #3b3b3b;

      background:
        var(--surface-hover);
    }


    /* =====================================================
       RECTANGULAR VIDEO THUMBNAIL
       ===================================================== */

    .thumbnail-link {
      display: block;
    }


    .thumbnail {
      position: relative;

      width: 100%;

      /*
        Standard rectangular video format.
      */

      aspect-ratio:
        16 / 9;

      overflow: hidden;

      background: #0e0e0e;
    }


    .thumbnail img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform 0.3s ease,
        filter 0.3s ease;
    }


    .thumbnail-link:hover
    .thumbnail img {
      transform:
        scale(1.025);

      filter:
        brightness(0.88);
    }


    /* =====================================================
       NEW BADGE
       ===================================================== */

    .new-badge {
      position: absolute;

      top: 9px;
      left: 9px;

      z-index: 5;

      padding:
        5px 8px;

      border-radius:
        5px;

      background:
        var(--accent);

      color:
        #fff;

      font-size:
        9px;

      font-weight:
        900;

      letter-spacing:
        1px;

      text-transform:
        uppercase;
    }


    /* =====================================================
       VIDEO INFORMATION
       ===================================================== */

    .video-content {
      min-height: 146px;

      padding:
        13px;

      display:
        flex;

      flex-direction:
        column;
    }


    /*
      ALL TITLES ARE UPPERCASE.
    */

    .video-title {
      margin: 0;

      min-height: 45px;

      color:
        #fff;

      font-size:
        20px;

      line-height:
        1.14;

      font-weight:
        800;

      letter-spacing:
        -0.35px;

      text-transform:
        uppercase;

      display:
        -webkit-box;

      -webkit-box-orient:
        vertical;

      -webkit-line-clamp:
        2;

      overflow:
        hidden;
    }


    .video-description {
      margin:
        7px 0 0;

      min-height:
        54px;

      color:
        var(--muted);

      font-size:
        12px;

      line-height:
        1.5;

      display:
        -webkit-box;

      -webkit-box-orient:
        vertical;

      -webkit-line-clamp:
        3;

      overflow:
        hidden;
    }


    /* =====================================================
       PRICE + BUTTON
       ===================================================== */

    .video-footer {
      margin-top:
        auto;

      padding-top:
        13px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        10px;
    }


    .price {
      color:
        #fff;

      font-size:
        15px;

      font-weight:
        800;

      white-space:
        nowrap;
    }


    .buy-button {
      min-height:
        36px;

      padding:
        8px 13px;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        7px;

      background:
        var(--accent);

      color:
        #fff;

      font-size:
        11px;

      font-weight:
        800;

      white-space:
        nowrap;

      transition:
        background 0.18s ease;
    }


    .buy-button:hover {
      background:
        var(--accent-hover);
    }


    /* =====================================================
       NO RESULTS
       ===================================================== */

    .no-results {
      grid-column:
        1 / -1;

      padding:
        50px 20px;

      border:
        1px dashed var(--border);

      border-radius:
        10px;

      text-align:
        center;

      color:
        var(--muted);
    }


    .no-results h3 {
      margin:
        0 0 7px;

      color:
        #fff;

      font-size:
        18px;
    }


    .no-results p {
      margin:
        0;

      font-size:
        13px;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {
      border-top:
        1px solid var(--border);

      padding:
        23px 20px;

      color:
        var(--muted);

      font-size:
        11px;

      text-align:
        center;
    }


    /* =====================================================
       MOBILE / WEBVIEW
       ===================================================== */

    @media (max-width: 700px) {

      .header-inner {
        min-height:
          62px;

        padding:
          0 12px;
      }


      .brand {
        gap:
          9px;
      }


      .brand-line {
        display:
          none;
      }


      .header-logo {
        width:
          40px;

        height:
          40px;

        flex-basis:
          40px;
      }


      .brand-name {
        font-size:
          18px;
      }


      .container {
        padding:
          14px 12px
          48px;
      }


      .banner {
        min-height:
          165px;

        border-radius:
          11px;
      }


      .banner-inner {
        min-height:
          165px;

        padding:
          18px;

        gap:
          14px;
      }


      .banner-logo {
        width:
          70px;

        height:
          70px;

        flex-basis:
          70px;

        border-radius:
          11px;

        padding:
          5px;
      }


      .banner-kicker {
        font-size:
          8px;

        letter-spacing:
          1.4px;
      }


      .banner-title {
        font-size:
          30px;

        letter-spacing:
          -1px;
      }


      .banner-text {
        margin-top:
          7px;

        font-size:
          11px;

        line-height:
          1.4;
      }


      #searchInput {
        height:
          46px;

        padding-left:
          43px;

        font-size:
          12px;
      }


      .search-wrap {
        margin-bottom:
          21px;
      }


      .section-title {
        font-size:
          22px;
      }


      .section-count {
        font-size:
          9px;
      }


      /*
        Two-column gallery remains on mobile.
      */

      #videoGrid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap:
          9px;
      }


      .video-card {
        border-radius:
          8px;
      }


      .video-content {
        min-height:
          125px;

        padding:
          9px;
      }


      .video-title {
        min-height:
          36px;

        font-size:
          15px;

        line-height:
          1.12;
      }


      .video-description {
        min-height:
          42px;

        margin-top:
          5px;

        font-size:
          10px;

        line-height:
          1.4;
      }


      .video-footer {
        padding-top:
          8px;
      }


      .price {
        font-size:
          12px;
      }


      .buy-button {
        min-height:
          30px;

        padding:
          6px 8px;

        font-size:
          9px;

        border-radius:
          5px;
      }


      .new-badge {
        top:
          6px;

        left:
          6px;

        padding:
          4px 6px;

        font-size:
          7px;
      }
    }


    /* =====================================================
       VERY SMALL PHONES
       ===================================================== */

    @media (max-width: 380px) {

      .container {
        padding-left:
          8px;

        padding-right:
          8px;
      }


      #videoGrid {
        gap:
          7px;
      }


      .video-content {
        min-height:
          118px;

        padding:
          8px;
      }


      .video-title {
        font-size:
          13px;

        min-height:
          30px;
      }


      .video-description {
        font-size:
          9px;

        min-height:
          38px;
      }


      .price {
        font-size:
          11px;
      }


      .buy-button {
        padding:
          6px 7px;

        font-size:
          8px;
      }
    }

  </style>
</head>


<body>


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="header">

    <div class="header-inner">

      <div class="brand">

        <div class="brand-line"></div>

        <img
          src="logo.png"
          alt="Rashka Barre"
          class="header-logo"
        >

        <div class="brand-name">
          Rashka Barre
        </div>

        <div class="brand-line"></div>

      </div>

    </div>

  </header>



  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="container">


    <!-- ===================================================
         BANNER
         =================================================== -->

    <section class="banner">

      <div class="banner-inner">

        <img
          src="logo.png"
          alt="Rashka Barre logo"
          class="banner-logo"
        >

        <div>

          <p class="banner-kicker">
            Official Video Collection
          </p>

          <h1 class="banner-title">
            Rashka Barre
          </h1>

          <p class="banner-text">
            Documentaries, animal stories, experiences and
            original videos — all in one place.
          </p>

        </div>

      </div>

    </section>



    <!-- ===================================================
         SEARCH BAR
         =================================================== -->

    <section class="search-wrap">

      <div class="search-box">

        <span
          class="search-icon"
          aria-hidden="true"
        >
          ⌕
        </span>

        <input
          id="searchInput"
          type="search"
          placeholder="Search videos..."
          autocomplete="off"
          spellcheck="false"
          aria-label="Search videos"
        >

      </div>

    </section>



    <!-- ===================================================
         VIDEO SECTION HEADER
         =================================================== -->

    <section class="section-head">

      <h2 class="section-title">
        Videos
      </h2>

      <span
        id="sectionCount"
        class="section-count"
      >
        0 videos
      </span>

    </section>



    <!-- ===================================================
         VIDEO GALLERY
         =================================================== -->

    <section
      id="videoGrid"
      aria-label="Rashka Barre video gallery"
    ></section>



    <!-- ===================================================
         NO RESULTS
         =================================================== -->

    <div
      id="emptyState"
      class="no-results"
      hidden
    >

      <h3>
        No videos found
      </h3>

      <p>
        Try another search.
      </p>

    </div>


  </main>



  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="footer">

    © <span id="year"></span> Rashka Barre

  </footer>



  <!-- =====================================================
       PRODUCTS
       ===================================================== -->

  <script src="products.js?v=20260926"></script>



  <!-- =====================================================
       GALLERY SCRIPT
       ===================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const grid =
          document.getElementById(
            "videoGrid"
          );

        const emptyState =
          document.getElementById(
            "emptyState"
          );

        const searchInput =
          document.getElementById(
            "searchInput"
          );

        const count =
          document.getElementById(
            "sectionCount"
          );

        const year =
          document.getElementById(
            "year"
          );


        /* Year */

        if (year) {

          year.textContent =
            new Date().getFullYear();

        }


        /* Products */

        const products =
          Array.isArray(
            window.PRODUCTS
          )
            ? [...window.PRODUCTS]
            : [];


        /*
          NEWEST → OLDEST
        */

        products.sort(
          function (a, b) {

            const dateA =
              new Date(
                a.publishedAt || 0
              ).getTime();

            const dateB =
              new Date(
                b.publishedAt || 0
              ).getTime();

            return dateB - dateA;

          }
        );


        /*
          Render videos
        */

        function renderVideos(
          searchTerm
        ) {

          const query =
            String(
              searchTerm || ""
            )
              .trim()
              .toLowerCase();


          const filtered =
            products.filter(
              function (product) {

                const title =
                  String(
                    product.title || ""
                  ).toLowerCase();


                const description =
                  String(
                    product.description || ""
                  ).toLowerCase();


                return (
                  !query ||
                  title.includes(query) ||
                  description.includes(query)
                );

              }
            );


          /*
            Count
          */

          count.textContent =
            filtered.length === 1
              ? "1 video"
              : `${filtered.length} videos`;


          /*
            No results
          */

          if (
            filtered.length === 0
          ) {

            grid.innerHTML =
              "";

            emptyState.hidden =
              false;

            return;
          }


          emptyState.hidden =
            true;


          /*
            Build cards
          */

          grid.innerHTML =
            filtered
              .map(
                function (
                  product
                ) {

                  const originalIndex =
                    products.indexOf(
                      product
                    );


                  const title =
                    escapeHtml(
                      product.title ||
                      "Untitled"
                    );


                  const description =
                    escapeHtml(
                      product.description ||
                      ""
                    );


                  const price =
                    escapeHtml(
                      product.price ||
                      ""
                    );


                  const thumbnail =
                    escapeHtml(
                      product.thumbnail ||
                      ""
                    );


                  const paymentUrl =
                    escapeHtml(
                      product.paymentUrl ||
                      "#"
                    );


                  /*
                    The newest video
                    receives NEW/CUSUB.
                  */

                  const isNew/CUSUB =
                    originalIndex === 0;


                  return `

                    <article
                      class="video-card"
                    >


                      <a
                        href="${paymentUrl}"
                        class="thumbnail-link"
                        aria-label="${title}"
                      >

                        <div
                          class="thumbnail"
                        >

                          ${
                            isNew
                              ? `
                                <span
                                  class="new-badge"
                                >
                                  New
                                </span>
                              `
                              : ""
                          }


                          <img
                            src="${thumbnail}"
                            alt="${title}"
                            loading="lazy"
                          >

                        </div>

                      </a>


                      <div
                        class="video-content"
                      >

                        <h3
                          class="video-title"
                        >
                          ${title}
                        </h3>


                        <p
                          class="video-description"
                        >
                          ${description}
                        </p>


                        <div
                          class="video-footer"
                        >

                          <span
                            class="price"
                          >
                            ${price}
                          </span>


                          <a
                            href="${paymentUrl}"
                            class="buy-button"
                          >
                            Buy & Watch
                          </a>

                        </div>

                      </div>

                    </article>

                  `;

                }
              )
              .join("");

        }


        /*
          Live search
        */

        searchInput.addEventListener(
          "input",
          function () {

            renderVideos(
              searchInput.value
            );

          }
        );


        /*
          Initial gallery
        */

        renderVideos("");

      }
    );


    /*
      Escape HTML
    */

    function escapeHtml(value) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>
</html>

       PRODUCTS
       ======================================================= -->

  <script src="products.js?v=20260926"></script>



  <!-- =======================================================
       GALLERY SCRIPT
       ======================================================= -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const grid =
          document.getElementById(
            "videoGrid"
          );


        const emptyState =
          document.getElementById(
            "emptyState"
          );


        const searchInput =
          document.getElementById(
            "searchInput"
          );


        const galleryCount =
          document.getElementById(
            "galleryCount"
          );


        const year =
          document.getElementById(
            "year"
          );


        /* Current year */

        if (year) {

          year.textContent =
            new Date().getFullYear();

        }


        /* Load product data */

        const products =
          Array.isArray(
            window.PRODUCTS
          )
            ? [...window.PRODUCTS]
            : [];


        /*
         * NEWEST → OLDEST
         */

        products.sort(
          function (a, b) {

            const dateA =
              new Date(
                a.publishedAt || 0
              ).getTime();


            const dateB =
              new Date(
                b.publishedAt || 0
              ).getTime();


            return dateB - dateA;

          }
        );


        /*
         * Render
         */

        function renderVideos(
          searchTerm
        ) {

          const query =
            String(
              searchTerm || ""
            )
              .trim()
              .toLowerCase();


          const filtered =
            products.filter(
              function (product) {

                const title =
                  String(
                    product.title || ""
                  ).toLowerCase();


                const subtitle =
                  String(
                    product.subtitle || ""
                  ).toLowerCase();


                const description =
                  String(
                    product.description || ""
                  ).toLowerCase();


                return (
                  !query ||

                  title.includes(
                    query
                  ) ||

                  subtitle.includes(
                    query
                  ) ||

                  description.includes(
                    query
                  )
                );

              }
            );


          /* Count */

          galleryCount.textContent =
            filtered.length === 1
              ? "1 video"
              : `${filtered.length} videos`;


          /* No results */

          if (
            filtered.length === 0
          ) {

            grid.innerHTML =
              "";

            emptyState.hidden =
              false;

            return;

          }


          emptyState.hidden =
            true;


          /*
           * Create video cards
           */

          grid.innerHTML =
            filtered
              .map(
                function (
                  product
                ) {

                  const title =
                    escapeHtml(
                      product.title ||
                      "Untitled"
                    );


                  const subtitle =
                    escapeHtml(
                      product.subtitle ||
                      ""
                    );


                  const description =
                    escapeHtml(
                      product.description ||
                      ""
                    );


                  const price =
                    escapeHtml(
                      product.price ||
                      ""
                    );


                  const thumbnail =
                    escapeHtml(
                      product.thumbnail ||
                      ""
                    );


                  const paymentUrl =
                    escapeHtml(
                      product.paymentUrl ||
                      "#"
                    );


                  /*
                   * First item in the sorted
                   * list = newest upload.
                   */

                  const isNew =
                    products.indexOf(
                      product
                    ) === 0;


                  return `

                    <article
                      class="video-item"
                    >


                      <!-- TITLE -->

                      <h2
                        class="video-title"
                      >
                        ${title}
                      </h2>


                      <!-- SUBTITLE -->

                      <p
                        class="video-subtitle"
                      >
                        ${subtitle}
                      </p>


                      <!-- THUMBNAIL -->

                      <a
                        href="${paymentUrl}"
                        class="thumbnail-link"
                        aria-label="${title}"
                      >

                        <div
                          class="thumbnail"
                        >

                          ${
                            isNew
                              ? `
                                <span
                                  class="new-badge"
                                >
                                  NEW
                                </span>
                              `
                              : ""
                          }


                          <img
                            src="${thumbnail}"
                            alt="${title}"
                            loading="lazy"
                          >

                        </div>

                      </a>


                      <!-- PRICE + BUTTON -->

                      <div
                        class="video-footer"
                      >

                        <span
                          class="price"
                        >
                          ${price}
                        </span>


                        <a
                          href="${paymentUrl}"
                          class="buy-button"
                        >
                          BUY & WATCH
                        </a>

                      </div>


                      <!-- DESCRIPTION -->

                      <p
                        class="video-description"
                      >
                        ${description}
                      </p>


                    </article>

                  `;

                }
              )
              .join("");

        }


        /*
         * SEARCH
         */

        searchInput.addEventListener(
          "input",
          function () {

            renderVideos(
              searchInput.value
            );

          }
        );


        /*
         * FIRST LOAD
         */

        renderVideos("");

      }
    );


    /*
     * Safely escape product data.
     */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>
